server:
  port: 8080
  forward-headers-strategy: framework
  tomcat:
    threads:
      max: 40
      min-spare: 5
  compression:
    enabled: true
    mime-types: application/json,application/javascript,text/html,text/css,text/plain,text/xml
    min-response-size: 1024

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/smart_job_tracker}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:password}
  jpa:
    hibernate:
      # Flyway owns and validates the schema. "none" skips Hibernate's per-entity
      # metadata scan (24+ DB round-trips at startup) which caused 13-minute hangs
      # on Render's free-tier PostgreSQL. Schema correctness is enforced by Flyway.
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

  mail:
    # Defaults target Gmail SMTP. In production set MAIL_USERNAME + MAIL_PASSWORD — for Gmail,
    # MAIL_PASSWORD must be a 16-character App Password (not your normal login password).
    # For another provider (Brevo, SendGrid, Mailgun, ...) override MAIL_HOST / MAIL_PORT too.
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          # Previously hard-coded to false, which meant mail could NEVER authenticate against a
          # real SMTP server (that was the "Unable to send the reset email" failure). Now default
          # to true and remain overridable via env vars.
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:true}

  # NOTE: Flyway/CORS properties must live under `spring:` — a top-level
  # `flyway:` block (as this file used to have) is silently ignored by Spring Boot.
  flyway:
    enabled: true
    baseline-on-migrate: true
app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  anthropic:
    api-key: ${ANTHROPIC_API_KEY:}
    model: ${ANTHROPIC_MODEL:claude-sonnet-4-20250514}
  ai-matching:
    provider: ${AI_MATCHING_PROVIDER:fallback}
    api-key: ${AI_MATCHING_API_KEY:}
    model: ${AI_MATCHING_MODEL:gemini-embedding-001}
    interview-model: ${AI_INTERVIEW_MODEL:gemini-2.0-flash}
    endpoint: ${AI_MATCHING_ENDPOINT:https://generativelanguage.googleapis.com/v1beta/models}
  gmail:
    enabled: ${GMAIL_ENABLED:false}
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
    redirect-uri: ${GMAIL_REDIRECT_URI:${RENDER_EXTERNAL_URL:http://localhost:8080}/api/gmail/callback}
    encryption-key: ${GMAIL_TOKEN_ENCRYPTION_KEY:}
    classification-provider: ${GMAIL_CLASSIFICATION_PROVIDER:fallback}
    classification-api-key: ${GMAIL_CLASSIFICATION_API_KEY:}
    classification-model: ${GMAIL_CLASSIFICATION_MODEL:gemini-3.6-flash}
    classification-endpoint: ${GMAIL_CLASSIFICATION_ENDPOINT:https://generativelanguage.googleapis.com/v1beta/models}
    classification-min-confidence: ${GMAIL_CLASSIFICATION_MIN_CONFIDENCE:0.80}
    classification-max-retries: ${GMAIL_CLASSIFICATION_MAX_RETRIES:2}
  whatsapp:
    enabled: ${WHATSAPP_ENABLED:false}
    phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:}
    access-token: ${WHATSAPP_ACCESS_TOKEN:}
    app-secret: ${WHATSAPP_APP_SECRET:}
    verify-token: ${WHATSAPP_VERIFY_TOKEN:}
    api-version: ${WHATSAPP_API_VERSION:v20.0}
    max-retries: ${WHATSAPP_MAX_RETRIES:5}
    poll-interval-ms: ${WHATSAPP_POLL_INTERVAL_MS:60000}
  google-calendar:
    redirect-uri: ${GOOGLE_CALENDAR_REDIRECT_URI:${RENDER_EXTERNAL_URL:http://localhost:8080}/api/google-calendar/callback}
  job-providers:
    min-interval-ms: ${JOB_PROVIDER_MIN_INTERVAL_MS:500}
    max-retries: ${JOB_PROVIDER_MAX_RETRIES:3}
    greenhouse:
      enabled: ${GREENHOUSE_ENABLED:false}
      boards: ${GREENHOUSE_BOARDS:}
    lever:
      enabled: ${LEVER_ENABLED:false}
      sites: ${LEVER_SITES:}
    ashby:
      enabled: ${ASHBY_ENABLED:false}
      boards: ${ASHBY_BOARDS:}
    jobspy:
      enabled: ${JOBSPY_ENABLED:false}
      service-url: ${JOBSPY_SERVICE_URL:}
      site-names: ${JOBSPY_SITE_NAMES:linkedin,indeed,glassdoor,google}
      results-wanted: ${JOBSPY_RESULTS_WANTED:20}
      hours-old: ${JOBSPY_HOURS_OLD:168}
    telegram:
      enabled: ${TELEGRAM_ENABLED:false}
      channels: ${TELEGRAM_CHANNELS:}
    skyvern:
      api-url: ${SKYVERN_API_URL:}
      api-key: ${SKYVERN_API_KEY:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    prometheus:
      enabled: true

logging:
  level:
    root: INFO
    # Verbose on purpose: this is the one flow (Google authorization-code exchange,
    # user-info fetch) that fails silently by default if left at INFO, since Spring
    # doesn't log per-request details or non-exceptional OAuth2 flow steps otherwise.
    org.springframework.security.oauth2: DEBUG
    com.smartjobtracker.security: DEBUG
