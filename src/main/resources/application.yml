server:
  port: 8080
  forward-headers-strategy: framework
  tomcat:
    threads:
      # Keep the thread stack footprint bounded on Render's 512 MB instance.
      max: ${TOMCAT_MAX_THREADS:12}
      min-spare: ${TOMCAT_MIN_SPARE_THREADS:2}
    max-connections: ${TOMCAT_MAX_CONNECTIONS:100}
    accept-count: ${TOMCAT_ACCEPT_COUNT:20}
    connection-timeout: ${TOMCAT_CONNECTION_TIMEOUT:20s}
  compression:
    enabled: true
    mime-types: application/json,application/javascript,text/html,text/css,text/plain,text/xml
    min-response-size: 1024

spring:
  servlet:
    multipart:
      # Spring's default is 1MB. Profile photos are capped at 2MB in ProfilePhotoProcessor; resumes may be larger.
      max-file-size: ${UPLOAD_MAX_FILE_SIZE:5MB}
      max-request-size: ${UPLOAD_MAX_REQUEST_SIZE:6MB}
  datasource:
    # Supabase transaction pooler uses port 6543. Render should set
    # SPRING_DATASOURCE_URL explicitly to the Supabase pooler hostname with
    # this port; the fallback keeps local/container startup pooler-compatible.
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:6543/smart_job_tracker}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:password}
    hikari:
      # Render's free Postgres session pool is limited; a large default pool
      # prevents the API from starting with EMAXCONNSESSION.
      # Two connections are the minimum needed for Flyway migration while
      # keeping the application well below Supabase's small pooler capacity.
      # Render also sets DB_MAX_POOL_SIZE=2 and DB_MIN_IDLE=0 explicitly.
      maximum-pool-size: ${DB_MAX_POOL_SIZE:2}
      minimum-idle: ${DB_MIN_IDLE:0}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:30000}
      validation-timeout: ${DB_VALIDATION_TIMEOUT_MS:5000}
      max-lifetime: ${DB_MAX_LIFETIME_MS:540000}
      data-source-properties:
        # Supabase transaction pooling cannot safely reuse server-side
        # prepared statements across backend connections.
        prepareThreshold: 0
  jpa:
    # Do not keep a database connection attached through response rendering.
    open-in-view: false
    hibernate:
      # Flyway owns and validates the schema. "none" skips Hibernate's per-entity
      # metadata scan (24+ DB round-trips at startup) which caused 13-minute hangs
      # on Render's free-tier PostgreSQL. Schema correctness is enforced by Flyway.
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        # The PostgreSQL dialect is fixed explicitly so Hibernate does not
        # consume another scarce Supabase pooler connection just to infer it.
        dialect: org.hibernate.dialect.PostgreSQLDialect
        boot:
          allow_jdbc_metadata_access: false
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

  mail:
    # Defaults target Gmail SMTP. In production set MAIL_USERNAME + MAIL_PASSWORD — for Gmail,
    # MAIL_PASSWORD must be a 16-character App Password (not your normal login password).
    # For another provider (Brevo, SendGrid, Mailgun, ...) override MAIL_HOST / MAIL_PORT too.
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          # Previously hard-coded to false, which meant mail could NEVER authenticate against a
          # real SMTP server (that was the "Unable to send the reset email" failure). Now default
          # to true and remain overridable via env vars.
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:true}

  # NOTE: Flyway/CORS properties must live under `spring:` — a top-level
  # `flyway:` block (as this file used to have) is silently ignored by Spring Boot.
  flyway:
    enabled: true
    baseline-on-migrate: true
app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  # Email of an existing account to promote to ADMIN at startup/login. Unset = no admin. Never a password.
  super-admin-email: ${SUPER_ADMIN_EMAIL:}
  support:
    # Max tickets a user may open per rolling hour.
    max-tickets-per-hour: ${SUPPORT_MAX_TICKETS_PER_HOUR:10}
  anthropic:
    api-key: ${ANTHROPIC_API_KEY:}
    model: ${ANTHROPIC_MODEL:claude-sonnet-4-20250514}
  ai-matching:
    provider: ${AI_MATCHING_PROVIDER:fallback}
    # GEMINI_API_KEY is the single-key shortcut; the feature-specific names still win when set.
    api-key: ${AI_MATCHING_API_KEY:${GEMINI_API_KEY:}}
    model: ${AI_MATCHING_MODEL:gemini-embedding-001}
    # Text-generation model for interview prep and resume tailoring. gemini-2.0-flash was retired (404).
    interview-model: ${AI_INTERVIEW_MODEL:gemini-3.6-flash}
    endpoint: ${AI_MATCHING_ENDPOINT:https://generativelanguage.googleapis.com/v1beta/models}
  # Shared limits for every Gemini call (GeminiGateway) so one key can serve many users.
  # Match requests-per-minute to your Gemini tier's RPM; calls beyond it wait up to queue-wait, then fall back offline.
  gemini:
    # 10 = Google free tier per-model RPM (the supplied key hit 429 at ~10 calls/2 min). Raise on a paid tier.
    requests-per-minute: ${GEMINI_REQUESTS_PER_MINUTE:10}
    max-concurrent: ${GEMINI_MAX_CONCURRENT:4}
    queue-wait: ${GEMINI_QUEUE_WAIT:PT20S}
    max-retries: ${GEMINI_MAX_RETRIES:2}
    thinking-budget: ${GEMINI_THINKING_BUDGET:0}
    cache-ttl: ${GEMINI_CACHE_TTL:PT12H}
    cache-max-entries: ${GEMINI_CACHE_MAX_ENTRIES:2000}
    user-daily-units: ${GEMINI_USER_DAILY_UNITS:40}
  gmail:
    enabled: ${GMAIL_ENABLED:false}
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
    redirect-uri: ${GMAIL_REDIRECT_URI:${RENDER_EXTERNAL_URL:http://localhost:8080}/api/gmail/callback}
    encryption-key: ${GMAIL_TOKEN_ENCRYPTION_KEY:}
    classification-provider: ${GMAIL_CLASSIFICATION_PROVIDER:fallback}
    classification-api-key: ${GMAIL_CLASSIFICATION_API_KEY:${GEMINI_API_KEY:}}
    classification-model: ${GMAIL_CLASSIFICATION_MODEL:gemini-3.6-flash}
    classification-endpoint: ${GMAIL_CLASSIFICATION_ENDPOINT:https://generativelanguage.googleapis.com/v1beta/models}
    classification-min-confidence: ${GMAIL_CLASSIFICATION_MIN_CONFIDENCE:0.80}
    classification-max-retries: ${GMAIL_CLASSIFICATION_MAX_RETRIES:2}
  whatsapp:
    enabled: ${WHATSAPP_ENABLED:false}
    phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:}
    access-token: ${WHATSAPP_ACCESS_TOKEN:}
    app-secret: ${WHATSAPP_APP_SECRET:}
    verify-token: ${WHATSAPP_VERIFY_TOKEN:}
    api-version: ${WHATSAPP_API_VERSION:v20.0}
    max-retries: ${WHATSAPP_MAX_RETRIES:5}
    poll-interval-ms: ${WHATSAPP_POLL_INTERVAL_MS:60000}
  google-calendar:
    redirect-uri: ${GOOGLE_CALENDAR_REDIRECT_URI:${RENDER_EXTERNAL_URL:http://localhost:8080}/api/google-calendar/callback}
  job-discovery:
    # Java Character.UnicodeScript names, comma-separated (e.g. ARABIC,HEBREW). Empty = block nothing.
    blocked-scripts: ${JOB_BLOCKED_SCRIPTS:ARABIC}
    # Jobs in this ISO country are listed first in Discover and dashboard recommendations. Blank = no preference.
    preferred-country: ${JOB_PREFERRED_COUNTRY:IN}
  job-providers:
    min-interval-ms: ${JOB_PROVIDER_MIN_INTERVAL_MS:500}
    max-retries: ${JOB_PROVIDER_MAX_RETRIES:3}
    greenhouse:
      enabled: ${GREENHOUSE_ENABLED:false}
      boards: ${GREENHOUSE_BOARDS:}
    lever:
      enabled: ${LEVER_ENABLED:false}
      sites: ${LEVER_SITES:}
    ashby:
      enabled: ${ASHBY_ENABLED:false}
      boards: ${ASHBY_BOARDS:}
    jobspy:
      enabled: ${JOBSPY_ENABLED:false}
      # Set JOBSPY_SERVICE_URL in Render when possible; this fallback keeps the
      # backend connected to the currently active JobSpy service.
      service-url: ${JOBSPY_SERVICE_URL:https://smart-job-application-tracker-1-k9jt.onrender.com}
      site-names: ${JOBSPY_SITE_NAMES:linkedin,indeed}
      results-wanted: ${JOBSPY_RESULTS_WANTED:20}
      hours-old: ${JOBSPY_HOURS_OLD:168}
      country: ${JOBSPY_COUNTRY:India}
      default-location: ${JOBSPY_DEFAULT_LOCATION:India}
    telegram:
      enabled: ${TELEGRAM_ENABLED:false}
      channels: ${TELEGRAM_CHANNELS:}
    skyvern:
      api-url: ${SKYVERN_API_URL:}
      api-key: ${SKYVERN_API_KEY:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    prometheus:
      enabled: true

logging:
  level:
    root: INFO
    # DEBUG OAuth logging is useful during setup but adds log I/O and allocation
    # pressure on the free instance. Enable temporarily via environment variables.
    org.springframework.security.oauth2: ${LOG_LEVEL_OAUTH2:INFO}
    com.smartjobtracker.security: ${LOG_LEVEL_SECURITY:INFO}
