name: Keep Render services awake

on:
  schedule:
    - cron: '*/14 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Spring Boot backend
        run: |
          curl -sf https://smart-job-tracker-api-iflm.onrender.com/api/health \
            --max-time 30 --retry 2 || echo "Backend ping failed (may be cold-starting)"

      - name: Ping JobSpy Python service
        run: |
          curl -sf https://smart-job-application-tracker-i1hc.onrender.com/health \
            --max-time 30 --retry 2 || echo "JobSpy ping failed (may be cold-starting)"
