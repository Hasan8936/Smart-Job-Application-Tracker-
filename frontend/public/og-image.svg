<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0118;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#160533;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#a78bfa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00f2fe;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle grid lines -->
  <g opacity="0.05" stroke="#a78bfa" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Glow orb top-right -->
  <circle cx="1050" cy="120" r="200" fill="#a78bfa" opacity="0.08"/>
  <!-- Glow orb bottom-left -->
  <circle cx="150" cy="520" r="180" fill="#00f2fe" opacity="0.06"/>

  <!-- Accent bar top -->
  <rect x="80" y="72" width="120" height="4" rx="2" fill="url(#accent)"/>

  <!-- Brand name -->
  <text x="80" y="60" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="#a78bfa" letter-spacing="3">SMART JOB TRACKER</text>

  <!-- Main headline -->
  <text x="80" y="210" font-family="Arial, sans-serif" font-size="72" font-weight="800" fill="#f8f6ff">Track. Match.</text>
  <text x="80" y="300" font-family="Arial, sans-serif" font-size="72" font-weight="800" fill="url(#accent)">Auto Apply.</text>

  <!-- Sub-headline -->
  <text x="80" y="370" font-family="Arial, sans-serif" font-size="28" fill="#b0a8c8">AI-powered job application management</text>
  <text x="80" y="410" font-family="Arial, sans-serif" font-size="28" fill="#b0a8c8">— built for serious job seekers.</text>

  <!-- Feature pills -->
  <g transform="translate(80, 470)">
    <!-- Pill 1 -->
    <rect width="210" height="44" rx="22" fill="#a78bfa" opacity="0.15"/>
    <rect width="210" height="44" rx="22" fill="none" stroke="#a78bfa" stroke-width="1" opacity="0.4"/>
    <text x="105" y="27" font-family="Arial, sans-serif" font-size="16" fill="#d4b8ff" text-anchor="middle">Resume Matching</text>

    <!-- Pill 2 -->
    <rect x="226" width="190" height="44" rx="22" fill="#00f2fe" opacity="0.1"/>
    <rect x="226" width="190" height="44" rx="22" fill="none" stroke="#00f2fe" stroke-width="1" opacity="0.3"/>
    <text x="321" y="27" font-family="Arial, sans-serif" font-size="16" fill="#a0eeff" text-anchor="middle">Job Discovery</text>

    <!-- Pill 3 -->
    <rect x="432" width="200" height="44" rx="22" fill="#a78bfa" opacity="0.12"/>
    <rect x="432" width="200" height="44" rx="22" fill="none" stroke="#a78bfa" stroke-width="1" opacity="0.35"/>
    <text x="532" y="27" font-family="Arial, sans-serif" font-size="16" fill="#d4b8ff" text-anchor="middle">Auto Apply (AI)</text>
  </g>

  <!-- Right side decorative card -->
  <rect x="820" y="200" width="300" height="200" rx="16" fill="#1a0533" opacity="0.7"/>
  <rect x="820" y="200" width="300" height="200" rx="16" fill="none" stroke="#a78bfa" stroke-width="1" opacity="0.3"/>
  <text x="970" y="255" font-family="Arial, sans-serif" font-size="14" fill="#a78bfa" text-anchor="middle" font-weight="600">MATCH SCORE</text>
  <text x="970" y="320" font-family="Arial, sans-serif" font-size="64" font-weight="800" fill="url(#accent)" text-anchor="middle" filter="url(#glow)">87%</text>
  <text x="970" y="360" font-family="Arial, sans-serif" font-size="13" fill="#7c6d99" text-anchor="middle">Strong Match · 12 skills aligned</text>

  <!-- URL -->
  <text x="80" y="590" font-family="Arial, monospace, sans-serif" font-size="16" fill="#5a4d72">smart-job-tracker-v2.vercel.app</text>
</svg>
