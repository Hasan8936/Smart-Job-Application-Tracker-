server:
  port: 8080
  # Render (and most PaaS) terminate TLS at their edge and forward the request to the app
  # over plain HTTP with X-Forwarded-* headers. This tells Spring to trust those headers so
  # it builds correct https:// URLs. Critical for OAuth2: without it, the redirect_uri sent
  # to Google is http://…:8080/… and Google rejects it with redirect_uri_mismatch.
  forward-headers-strategy: framework

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/smart_job_tracker}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:password}
  jpa:
    hibernate:
      # Flyway owns the schema (see below) — "validate" catches drift instead of
      # letting Hibernate silently alter tables behind Flyway's back.
      ddl-auto: validate
    show-sql: false

  mail:
    # Defaults target Gmail SMTP. In production set MAIL_USERNAME + MAIL_PASSWORD — for Gmail,
    # MAIL_PASSWORD must be a 16-character App Password (not your normal login password).
    # For another provider (Brevo, SendGrid, Mailgun, ...) override MAIL_HOST / MAIL_PORT too.
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          # Previously hard-coded to false, which meant mail could NEVER authenticate against a
          # real SMTP server (that was the "Unable to send the reset email" failure). Now default
          # to true and remain overridable via env vars.
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:true}

  # NOTE: Flyway/CORS properties must live under `spring:` — a top-level
  # `flyway:` block (as this file used to have) is silently ignored by Spring Boot.
  flyway:
    enabled: true
    baseline-on-migrate: true
app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  ai-matching:
    provider: ${AI_MATCHING_PROVIDER:fallback}
    api-key: ${AI_MATCHING_API_KEY:}
    model: ${AI_MATCHING_MODEL:gemini-embedding-001}
    endpoint: ${AI_MATCHING_ENDPOINT:https://generativelanguage.googleapis.com/v1beta/models}
  job-providers:
    min-interval-ms: ${JOB_PROVIDER_MIN_INTERVAL_MS:500}
    max-retries: ${JOB_PROVIDER_MAX_RETRIES:3}
    greenhouse:
      enabled: ${GREENHOUSE_ENABLED:false}
      boards: ${GREENHOUSE_BOARDS:}
    lever:
      enabled: ${LEVER_ENABLED:false}
      sites: ${LEVER_SITES:}
    ashby:
      enabled: ${ASHBY_ENABLED:false}
      boards: ${ASHBY_BOARDS:}
    apify:
      enabled: ${APIFY_ENABLED:false}
      token: ${APIFY_TOKEN:}
      actor: ${APIFY_ACTOR:}
  cors:
    # Comma-separated origin patterns; wildcard Vercel subdomains work with credentials.
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:https://*.vercel.app,http://localhost:5173,http://localhost:3000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    prometheus:
      enabled: true

logging:
  level:
    root: INFO
