name: Deploy

on:
  push:
    branches: [ main ]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        run: |
          docker build -f Dockerfile -t ${{ secrets.DOCKERHUB_USERNAME }}/sjt-backend:${{ github.sha }} .
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/sjt-backend:${{ github.sha }}

      - name: Deploy backend to Render
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID_BACKEND: ${{ secrets.RENDER_SERVICE_ID_BACKEND }}
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/sjt-backend:${{ github.sha }}
        run: |
          echo "Triggering Render deploy for backend..."
          curl -s -X POST https://api.render.com/v1/services/${RENDER_SERVICE_ID_BACKEND}/deploys \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "{\"dockerImage\": \"${IMAGE}\"}"

      - name: Build and push frontend image
        run: |
          docker build -f frontend/Dockerfile -t ${{ secrets.DOCKERHUB_USERNAME }}/sjt-frontend:${{ github.sha }} frontend
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/sjt-frontend:${{ github.sha }}

      - name: Deploy frontend to Render
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID_FRONTEND: ${{ secrets.RENDER_SERVICE_ID_FRONTEND }}
          IMAGE_FRONT: ${{ secrets.DOCKERHUB_USERNAME }}/sjt-frontend:${{ github.sha }}
        run: |
          echo "Triggering Render deploy for frontend..."
          curl -s -X POST https://api.render.com/v1/services/${RENDER_SERVICE_ID_FRONTEND}/deploys \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "{\"dockerImage\": \"${IMAGE_FRONT}\"}"

      # Optional: trigger Render or other provider here using their API (requires additional secrets)
