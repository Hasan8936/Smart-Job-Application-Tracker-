<svg width="520" height="100" viewBox="0 0 520 100" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Smart Job Tracker</title>
  <desc id="desc">A comet on an orbit ring beside the Smart Job Tracker wordmark</desc>
  <defs>
    <linearGradient id="ringGrad" x1="4" y1="6" x2="34" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f472c9"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <radialGradient id="orbGrad" cx="0.32" cy="0.28" r="0.85">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="16%" stop-color="#ffd9f5"/>
      <stop offset="42%" stop-color="#f472c9"/>
      <stop offset="70%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </radialGradient>
  </defs>
  <g transform="translate(8,10) scale(2)">
    <path d="M 30.8 25.2 A 13 13 0 1 1 30.8 14.8" fill="none" stroke="url(#ringGrad)" stroke-width="3.4" stroke-linecap="round"/>
    <circle cx="30.8" cy="14.8" r="4.6" fill="url(#orbGrad)"/>
    <circle cx="35.4" cy="20" r="1.5" fill="#a855f7" opacity="0.55"/>
  </g>
  <text x="110" y="66" font-family="'DM Sans', 'Inter', Arial, sans-serif" font-weight="700" font-size="38" letter-spacing="-1" fill="#181925">Smart Job Tracker</text>
</svg>
