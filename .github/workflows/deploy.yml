name: Deploy

# NOTE: Render (smart-job-tracker-api-iflm) and Vercel (frontend) are both connected
# directly to this repo and auto-deploy on every push to main — see DEPLOYMENT_SETUP.md.
# This workflow is an OPTIONAL extra path (Docker Hub image + a manual Render deploy-hook
# call) and only makes sense if you actually publish images to Docker Hub. It's gated on
# the required secrets existing so it skips cleanly instead of failing when they're not
# set, rather than showing a red X on every push.

on:
  push:
    branches: [ main ]

jobs:
  publish:
    runs-on: ubuntu-latest
    if: ${{ vars.ENABLE_DOCKERHUB_DEPLOY == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        run: |
          docker build -f Dockerfile -t ${{ secrets.DOCKERHUB_USERNAME }}/sjt-backend:${{ github.sha }} .
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/sjt-backend:${{ github.sha }}

      - name: Deploy backend to Render
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID_BACKEND: ${{ secrets.RENDER_SERVICE_ID_BACKEND }}
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/sjt-backend:${{ github.sha }}
        run: |
          echo "Triggering Render deploy for backend..."
          curl -s -X POST https://api.render.com/v1/services/${RENDER_SERVICE_ID_BACKEND}/deploys \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "{\"dockerImage\": \"${IMAGE}\"}"

      - name: Build and push frontend image
        run: |
          docker build -f frontend/Dockerfile -t ${{ secrets.DOCKERHUB_USERNAME }}/sjt-frontend:${{ github.sha }} frontend
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/sjt-frontend:${{ github.sha }}

      - name: Deploy frontend to Render
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID_FRONTEND: ${{ secrets.RENDER_SERVICE_ID_FRONTEND }}
          IMAGE_FRONT: ${{ secrets.DOCKERHUB_USERNAME }}/sjt-frontend:${{ github.sha }}
        run: |
          echo "Triggering Render deploy for frontend..."
          curl -s -X POST https://api.render.com/v1/services/${RENDER_SERVICE_ID_FRONTEND}/deploys \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "{\"dockerImage\": \"${IMAGE_FRONT}\"}"
