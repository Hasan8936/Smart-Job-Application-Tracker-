        /* Boot loader: plain CSS because Tailwind isn't loaded yet. */
        .boot { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #fafafa; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
        html[data-theme='dark'] .boot { background: #07101f; }

        @keyframes boot-in { from { opacity: 0; transform: translateY(6px) scale(.98); } to { opacity: 1; transform: none; } }
