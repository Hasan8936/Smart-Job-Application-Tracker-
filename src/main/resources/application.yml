server:
  port: 8080

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/smart_job_tracker}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:password}
  jpa:
    hibernate:
      # Flyway owns the schema (see below) — "validate" catches drift instead of
      # letting Hibernate silently alter tables behind Flyway's back.
      ddl-auto: validate
    show-sql: false

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:25}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

  # NOTE: Flyway/CORS properties must live under `spring:` — a top-level
  # `flyway:` block (as this file used to have) is silently ignored by Spring Boot.
  flyway:
    enabled: true
    baseline-on-migrate: true

app:
  cors:
    # Comma-separated list of allowed origins for the frontend (Vercel URL, localhost, etc.)
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    prometheus:
      enabled: true

logging:
  level:
    root: INFO
